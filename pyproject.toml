[project]
name = "teamclaw"
version = "0.1.0"
description = "Multi-agent digital-employee platform: code-execution substrate + context ledger + zero-cost model routing + eval harness"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0", "torch>=2.3"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
teamclaw = "teamclaw.cli:app"

[tool.hatch.build.targets.wheel.force-include]
"web" = "teamclaw/web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
