<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally Console</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <h1>Tally</h1>
      <div class="sub" id="version">—</div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="overview" aria-current="true">Overview</button>
      <button data-view="agents">Agents</button>
      <button data-view="console">Console</button>
      <button data-view="runs">Runs</button>
      <button data-view="hitl">Needs a human <span class="badge" id="hitl-badge">0</span></button>
      <button data-view="insight">Measurements</button>
    </nav>
    <div class="sidebar-foot">
      <div class="row"><span class="health-dot" id="dot-sandbox"></span><span id="foot-sandbox">sandbox —</span></div>
      <div class="row"><span class="health-dot" id="dot-session"></span><span id="foot-session">session —</span></div>
      <div class="row"><span class="health-dot" id="dot-provider"></span><span id="foot-provider">providers —</span></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
